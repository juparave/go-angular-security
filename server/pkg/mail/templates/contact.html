<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form Notification</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    .container { background: #ffffff; max-width: 600px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #4f46e5; color: #ffffff; padding: 24px 32px; }
    .header h1 { margin: 0; font-size: 22px; }
    .body { padding: 32px; color: #333333; }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #666666; margin-bottom: 4px; }
    .field p { margin: 0; font-size: 15px; line-height: 1.5; }
    .message-box { background: #f9f9f9; border-left: 4px solid #4f46e5; padding: 16px; border-radius: 4px; }
    .footer { background: #f4f4f4; padding: 16px 32px; text-align: center; font-size: 12px; color: #999999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>New Contact Form Message</h1>
    </div>
    <div class="body">
      <div class="field">
        <label>From</label>
        <p>{{.Name}} &lt;{{.Email}}&gt;</p>
      </div>
      <div class="field">
        <label>Message</label>
        <div class="message-box">
          <p>{{.Message}}</p>
        </div>
      </div>
    </div>
    <div class="footer">
      <p>This message was sent via the contact form on {{.AppName}}.</p>
    </div>
  </div>
</body>
</html>
