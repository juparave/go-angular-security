<app-auth-layout>
  <div auth-progress *ngIf="isSubmitting$ | async" class="auth-progress-bar"></div>

  <div auth-left class="login-form-side">
    <h2 class="login-title">Sign In</h2>

    <form [formGroup]="loginForm" class="login-form" (ngSubmit)="doLogin()">
      <app-backend-error-messages
        *ngIf="backendErrors$ | async as errors"
        [backendErrors]="errors"></app-backend-error-messages>

      <div class="form-group">
        <label for="email-input" class="form-label">Email Address</label>
        <input
          id="email-input"
          type="email"
          placeholder="email@example.com"
          class="form-input"
          formControlName="email"
          data-testid="email"
          required />
        <p
          class="form-error"
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please provide a valid email address
        </p>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="password-input" class="form-label">Password</label>
          <a [routerLink]="['/login', 'request-reset-password']" class="forgot-password-link">
            Forgot password?
          </a>
        </div>
        <div class="password-input-wrapper">
          <input
            id="password-input"
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Password"
            class="form-input"
            formControlName="password"
            data-testid="password"
            name="password"
            required />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Toggle password visibility'"
            [attr.aria-pressed]="!hidePassword">
            <mat-icon class="password-toggle-icon">
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
        </div>
        <p
          class="form-error"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Please provide a valid password
        </p>
      </div>

      <button
        type="submit"
        class="login-button"
        data-testid="login-button"
        [disabled]="isSubmitting$ | async">
        Sign In
      </button>

      <div class="signup-link-wrapper">
        <span class="signup-text">Don't have an account?</span>
        <a [routerLink]="['../', 'sign-up']" class="signup-link">Register</a>
      </div>
    </form>
  </div>

  <div auth-right class="login-content-side">
    <div class="content-illustration">
      <svg viewBox="0 0 400 400" class="illustration-svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color: #5b7fff; stop-opacity: 1" />
            <stop offset="100%" style="stop-color: #3b5bdb; stop-opacity: 1" />
          </linearGradient>
          <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: #ffb84d; stop-opacity: 1" />
            <stop offset="100%" style="stop-color: #ff9f43; stop-opacity: 1" />
          </linearGradient>
        </defs>

        <rect x="80" y="100" width="240" height="200" rx="16" fill="#2C3E50" opacity="0.9" />
        <rect x="100" y="120" width="80" height="60" rx="8" fill="url(#grad1)" />
        <rect x="190" y="140" width="80" height="40" rx="8" fill="url(#grad2)" />
        <rect x="100" y="200" width="170" height="80" rx="8" fill="#374151" opacity="0.6" />

        <rect x="110" y="250" width="20" height="20" rx="4" fill="#5B7FFF" />
        <rect x="140" y="240" width="20" height="30" rx="4" fill="#5B7FFF" />
        <rect x="170" y="230" width="20" height="40" rx="4" fill="#FFB84D" />
        <rect x="200" y="220" width="20" height="50" rx="4" fill="#FFB84D" />
        <rect x="230" y="235" width="20" height="35" rx="4" fill="#5B7FFF" />

        <circle cx="105" cy="125" r="8" fill="#10B981" />
        <path d="M 102 125 L 104 127 L 108 123" stroke="white" stroke-width="2" fill="none" />
        <circle cx="105" cy="145" r="8" fill="#10B981" />
        <path d="M 102 145 L 104 147 L 108 143" stroke="white" stroke-width="2" fill="none" />

        <circle cx="300" cy="80" r="15" fill="#FFB84D" opacity="0.8" />
        <circle cx="320" cy="120" r="10" fill="#5B7FFF" opacity="0.7" />
        <rect
          x="70"
          y="90"
          width="15"
          height="15"
          rx="3"
          fill="#10B981"
          opacity="0.7"
          transform="rotate(15 77.5 97.5)" />

        <ellipse cx="290" cy="250" rx="25" ry="30" fill="#FBBF77" opacity="0.9" />
        <rect x="265" y="240" width="50" height="25" rx="12" fill="#5B7FFF" />
        <circle cx="295" cy="235" r="8" fill="#FFD93D" />
      </svg>
    </div>

    <div class="content-text">
      <h3 class="content-title">Welcome back</h3>
      <p class="content-description">
        Manage your team, subscriptions, and settings from a single, secure dashboard.
      </p>
    </div>

    <div class="progress-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</app-auth-layout>
